<svg width="850" height="500" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景和网格 -->
    <defs>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
            <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#f0f0f0" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)" />
    
    <!-- 路径线段 -->
    <!-- I到J段 -->
    <line x1="100" y1="200" x2="300" y2="200" stroke="#3B82F6" stroke-width="4" />
    <!-- J到K段 -->
    <line x1="300" y1="200" x2="600" y2="300" stroke="#3B82F6" stroke-width="4" />
    <!-- A到B的连线 -->
    <line x1="250" y1="200" x2="350" y2="216.7" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8,4" />
    <text x="300" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#6D28D9">A到B连线</text>
    
    <!-- 路径点 -->
    <!-- I点 -->
    <circle cx="100" cy="200" r="10" fill="#3B82F6" />
    <text x="100" y="170" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">I</text>
    <text x="100" y="240" font-family="Arial" font-size="12" text-anchor="middle">(100,200)</text>
    
    <!-- J点 -->
    <circle cx="300" cy="200" r="10" fill="#3B82F6" />
    <text x="300" y="170" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">J</text>
    <text x="300" y="240" font-family="Arial" font-size="12" text-anchor="middle">(300,200)</text>
    
    <!-- K点 -->
    <circle cx="600" cy="300" r="10" fill="#3B82F6" />
    <text x="600" y="270" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">K</text>
    <text x="600" y="340" font-family="Arial" font-size="12" text-anchor="middle">(600,300)</text>
    
    <!-- 段长度标注 -->
    <!-- IJ段长度 -->
    <line x1="200" y1="170" x2="200" y2="130" stroke="#64748B" stroke-width="1" />
    <text x="200" y="120" font-family="Arial" font-size="14" text-anchor="middle" fill="#64748B">长度=200</text>
    
    <!-- JK段长度 -->
    <line x1="450" y1="230" x2="450" y2="180" stroke="#64748B" stroke-width="1" />
    <text x="450" y="170" font-family="Arial" font-size="14" text-anchor="middle" fill="#64748B">长度≈316</text>
    <text x="450" y="190" font-family="Arial" font-size="12" text-anchor="middle" fill="#64748B">(√(300²+100²))</text>
    
    <!-- 累积长度标注 -->
    <text x="300" y="270" font-family="Arial" font-size="14" text-anchor="middle" fill="#1E40AF">累积长度=200 (到J点)</text>
    <text x="600" y="370" font-family="Arial" font-size="14" text-anchor="middle" fill="#1E40AF">累积长度≈516 (到K点)</text>
    
    <!-- 目标点A：在IJ段上 (targetL=150) -->
    <circle cx="250" cy="200" r="8" fill="#EF4444" />
    <text x="250" y="150" font-family="Arial" font-size="14" text-anchor="middle" fill="#DC2626">目标点A</text>
    <text x="250" y="170" font-family="Arial" font-size="12" text-anchor="middle" fill="#DC2626">L=150</text>
    <!-- 延长坐标线 -->
    <line x1="250" y1="200" x2="250" y2="250" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,3" />
    <!-- 大幅下移坐标文本 -->
    <text x="250" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="#DC2626">(250,200)</text>
    
    <!-- 目标点B：在JK段上 (targetL=300) -->
    <circle cx="350" cy="216.7" r="8" fill="#EF4444" />
    <text x="350" y="160" font-family="Arial" font-size="14" text-anchor="middle" fill="#DC2626">目标点B</text>
    <text x="350" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#DC2626">L=300</text>
    <!-- 延长坐标线 -->
    <line x1="350" y1="216.7" x2="350" y2="260" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,3" />
    <!-- 大幅下移坐标文本 -->
    <text x="350" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="#DC2626">(350,216.7)</text>
    
    <!-- 箭头指示累积长度方向 -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6" />
        </marker>
        <marker id="purpleArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#8B5CF6" />
        </marker>
    </defs>
    <line x1="150" y1="230" x2="250" y2="230" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="350" y1="230" x2="550" y2="290" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="200" y="220" font-family="Arial" font-size="14" text-anchor="middle" fill="#3B82F6">累积长度增加方向</text>
    
    <!-- 图例 -->
    <g transform="translate(700, 50)">
        <text x="0" y="0" font-family="Arial" font-size="14" font-weight="bold">图例</text>
        <line x1="0" y1="25" x2="40" y2="25" stroke="#3B82F6" stroke-width="4" />
        <text x="50" y="30" font-family="Arial" font-size="12">路径段 (I→J→K)</text>
        
        <circle cx="20" cy="60" r="8" fill="#EF4444" />
        <text x="50" y="65" font-family="Arial" font-size="12">目标点 (A、B)</text>
        
        <line x1="0" y1="95" x2="40" y2="95" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8,4" />
        <text x="50" y="100" font-family="Arial" font-size="12">A到B连线</text>
        
        <line x1="0" y1="130" x2="40" y2="130" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,3" />
        <text x="50" y="135" font-family="Arial" font-size="12">目标点坐标线</text>
    </g>
</svg>
